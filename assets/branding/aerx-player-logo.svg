<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1200"
    height="1200"
    viewBox="0 0 1200 1200"
    fill="none">

  <title>ÆRx Player</title>
  <desc>
    ÆRx Player — Radio y Audio.
    Official logo of the ÆRx Player open-source application.
    Wordmark converted to real vector outlines (Inter ExtraBold/Medium/Regular)
    via fontTools — no font dependency at render time.
  </desc>

  <defs>

    <!-- ========================================================= -->
    <!-- BRAND GRADIENTS                                           -->
    <!-- ========================================================= -->

    <linearGradient
        id="waveGradient"
        x1="100"
        y1="300"
        x2="1100"
        y2="650"
        gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#06D9FF"/>
      <stop offset="32%"  stop-color="#00BFFF"/>
      <stop offset="58%"  stop-color="#4169FF"/>
      <stop offset="78%"  stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC22FF"/>
    </linearGradient>

    <linearGradient
        id="xGradient"
        x1="790"
        y1="700"
        x2="1030"
        y2="900"
        gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#06D9FF"/>
      <stop offset="45%"  stop-color="#3B82F6"/>
      <stop offset="72%"  stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC22FF"/>
    </linearGradient>

    <linearGradient
        id="metalGradient"
        x1="350"
        y1="690"
        x2="650"
        y2="900"
        gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="45%"  stop-color="#F8FAFC"/>
      <stop offset="72%"  stop-color="#DDE7F5"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient
        id="playerGradient"
        x1="480"
        y1="900"
        x2="760"
        y2="1000"
        gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE7F5"/>
    </linearGradient>

    <linearGradient
        id="barGradient"
        x1="450"
        y1="1015"
        x2="750"
        y2="1015"
        gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#06D9FF"/>
      <stop offset="50%"  stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>


    <!-- ========================================================= -->
    <!-- WAVE HIGHLIGHT                                            -->
    <!-- ========================================================= -->

    <linearGradient
        id="waveHighlight"
        x1="180"
        y1="270"
        x2="1050"
        y2="600"
        gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="30%"  stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="55%"  stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>


    <!-- ========================================================= -->
    <!-- GLOWS                                                      -->
    <!-- ========================================================= -->

    <filter
        id="waveGlow"
        x="-30%"
        y="-50%"
        width="160%"
        height="200%"
        color-interpolation-filters="sRGB">

      <feGaussianBlur
          stdDeviation="16"
          result="blur"/>

      <feColorMatrix
          in="blur"
          type="matrix"
          values="
            0 0 0 0 0.05
            0 0 0 0 0.55
            0 0 0 0 1
            0 0 0 0.65 0"
          result="colored"/>

      <feMerge>
        <feMergeNode in="colored"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>


    <filter
        id="softGlow"
        x="-50%"
        y="-50%"
        width="200%"
        height="200%">

      <feGaussianBlur
          stdDeviation="8"
          result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>


    <!-- ========================================================= -->
    <!-- WORDMARK SHADOW                                            -->
    <!-- ========================================================= -->

    <filter
        id="wordShadow"
        x="-20%"
        y="-20%"
        width="140%"
        height="150%">

      <feDropShadow
          dx="0"
          dy="7"
          stdDeviation="6"
          flood-color="#000000"
          flood-opacity="0.35"/>
    </filter>


    <!-- ========================================================= -->
    <!-- SUBTLE INNER SHINE                                         -->
    <!-- ========================================================= -->

    <linearGradient
        id="shine"
        x1="0"
        y1="0"
        x2="0"
        y2="1">

      <stop
          offset="0%"
          stop-color="#FFFFFF"
          stop-opacity="0.28"/>

      <stop
          offset="45%"
          stop-color="#FFFFFF"
          stop-opacity="0"/>

      <stop
          offset="100%"
          stop-color="#FFFFFF"
          stop-opacity="0.08"/>
    </linearGradient>

  </defs>


  <!-- =========================================================== -->
  <!-- AERX WAVEFORM                                               -->
  <!-- =========================================================== -->

  <g id="waveform"
     filter="url(#waveGlow)">

    <!-- Main waveform -->
    <path
        d="
        M 90 435

        C 155 445,
          215 395,
          275 350

        C 325 312,
          365 320,
          400 385

        C 440 460,
          455 535,
          505 545

        C 560 555,
          575 475,
          600 390

        C 625 305,
          650 205,
          710 185

        C 765 167,
          795 230,
          820 315

        C 850 415,
          865 530,
          920 545

        C 975 560,
          990 475,
          1015 405

        C 1040 335,
          1080 315,
          1120 345

        C 1150 368,
          1170 395,
          1185 410
        "
        stroke="url(#waveGradient)"
        stroke-width="72"
        stroke-linecap="round"
        stroke-linejoin="round"/>


    <!-- Soft internal highlight -->
    <path
        d="
        M 90 420

        C 155 430,
          215 380,
          275 335

        C 325 297,
          365 305,
          400 370

        C 440 445,
          455 520,
          505 530

        C 560 540,
          575 460,
          600 375

        C 625 290,
          650 190,
          710 170

        C 765 152,
          795 215,
          820 300

        C 850 400,
          865 515,
          920 530

        C 975 545,
          990 460,
          1015 390

        C 1040 320,
          1080 300,
          1120 330

        C 1150 353,
          1170 380,
          1185 395
        "
        stroke="url(#waveHighlight)"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.85"/>

  </g>


